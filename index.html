<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Character Wordle</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:#121213;
color:white;

display:flex;
flex-direction:column;
align-items:center;

min-height:100vh;

}

h1{

margin:20px;
letter-spacing:2px;

}

#message{

height:30px;
font-size:20px;
font-weight:bold;

display:flex;
justify-content:center;
align-items:center;

}

#board{

display:grid;
grid-template-rows:repeat(6,1fr);

gap:6px;

margin:20px;

}

.row{

display:grid;
grid-template-columns:repeat(5,1fr);

gap:6px;

}

.tile{

width:62px;
height:62px;

border:2px solid #3a3a3c;

display:flex;
justify-content:center;
align-items:center;

font-size:2rem;
font-weight:bold;

text-transform:uppercase;

transition:.25s;

}

.correct{

background:#538d4e;
border-color:#538d4e;

}

.present{

background:#b59f3b;
border-color:#b59f3b;

}

.absent{

background:#3a3a3c;
border-color:#3a3a3c;

}

.flip{

animation:flip .45s ease;

}

@keyframes flip{

0%{

transform:rotateX(0deg);

}

50%{

transform:rotateX(90deg);

}

100%{

transform:rotateX(0deg);

}

}

#keyboard{

margin-top:15px;

display:flex;
flex-direction:column;

gap:8px;

}

.keyRow{

display:flex;
justify-content:center;

gap:5px;

}

.key{

width:43px;
height:58px;

border:none;

background:#818384;

color:white;

font-weight:bold;

border-radius:4px;

cursor:pointer;

}

.big{

width:72px;

}

button.correct{

background:#538d4e;

}

button.present{

background:#b59f3b;

}

button.absent{

background:#3a3a3c;

}

#restart{

margin-top:25px;

padding:12px 20px;

font-size:18px;

display:none;

cursor:pointer;

}

@media(max-width:600px){

.tile{

width:54px;
height:54px;

font-size:1.7rem;

}

.key{

width:34px;
height:50px;

}

.big{

width:60px;

}

}

</style>

</head>

<body>

<h1>Character Wordle</h1>

<div id="message"></div>

<div id="board">

<div class="row">
<div class="tile"></div>
<div class="tile"></div>
<div class="tile"></div>
<div class="tile"></div>
<div class="tile"></div>
</div>

<div class="row">
<div class="tile"></div>
<div class="tile"></div>
<div class="tile"></div>
<div class="tile"></div>
<div class="tile"></div>
</div>

<div class="row">
<div class="tile"></div>
<div class="tile"></div>
<div class="tile"></div>
<div class="tile"></div>
<div class="tile"></div>
</div>

<div class="row">
<div class="tile"></div>
<div class="tile"></div>
<div class="tile"></div>
<div class="tile"></div>
<div class="tile"></div>
</div>

<div class="row">
<div class="tile"></div>
<div class="tile"></div>
<div class="tile"></div>
<div class="tile"></div>
<div class="tile"></div>
</div>

<div class="row">
<div class="tile"></div>
<div class="tile"></div>
<div class="tile"></div>
<div class="tile"></div>
<div class="tile"></div>
</div>

</div>

<div id="keyboard">

<div class="keyRow">
<button class="key">Q</button>
<button class="key">W</button>
<button class="key">E</button>
<button class="key">R</button>
<button class="key">T</button>
<button class="key">Y</button>
<button class="key">U</button>
<button class="key">I</button>
<button class="key">O</button>
<button class="key">P</button>
</div>

<div class="keyRow">
<button class="key">A</button>
<button class="key">S</button>
<button class="key">D</button>
<button class="key">F</button>
<button class="key">G</button>
<button class="key">H</button>
<button class="key">J</button>
<button class="key">K</button>
<button class="key">L</button>
</div>

<div class="keyRow">
<button class="key big">ENTER</button>
<button class="key">Z</button>
<button class="key">X</button>
<button class="key">C</button>
<button class="key">V</button>
<button class="key">B</button>
<button class="key">N</button>
<button class="key">M</button>
<button class="key big">⌫</button>
</div>

</div>

<button id="restart">Play Again</button>

<script>

const words=[

"MARIO",
"LUIGI",
"ZELDA",
"ARIEL",
"BELLE",
"DAISY",
"FRODO",
"BILBO",
"ROBIN",
"LOGAN",
"ALPHA",
"SHREK",
"MULAN",
"OSCAR",
"GOMEZ",
"WOODY",
"MANNY",
"RANGO",


];

let answer=words[Math.floor(Math.random()*words.length)];

const rows=document.querySelectorAll(".row");
const keys=document.querySelectorAll(".key");

const message=document.getElementById("message");
const restart=document.getElementById("restart");

let currentRow=0;
let currentCol=0;
let gameOver=false;

function currentGuess(){

let guess="";

rows[currentRow]
.querySelectorAll(".tile")
.forEach(tile=>guess+=tile.textContent);

return guess;

}

function showMessage(text){

message.textContent=text;

setTimeout(()=>{

if(message.textContent===text){

message.textContent="";

}

},2000);

}

function typeLetter(letter){

if(gameOver) return;

if(currentCol>=5) return;

const tile=rows[currentRow].children[currentCol];

tile.textContent=letter;

currentCol++;

}

function deleteLetter(){

if(gameOver) return;

if(currentCol<=0) return;

currentCol--;

rows[currentRow].children[currentCol].textContent="";

}

function colorKey(letter,color){

keys.forEach(key=>{

if(key.textContent!==letter) return;

if(key.classList.contains("correct")) return;

if(key.classList.contains("present")&&color==="absent") return;

key.classList.remove("correct","present","absent");

key.classList.add(color);

});

}

document.addEventListener("keydown",e=>{

if(gameOver) return;

const key=e.key.toUpperCase();

if(/^[A-Z]$/.test(key)){

typeLetter(key);

}

else if(e.key==="Backspace"){

deleteLetter();

}

else if(e.key==="Enter"){

submitGuess();

}

});

keys.forEach(key=>{

key.onclick=()=>{

const value=key.textContent;

if(value==="ENTER"){

submitGuess();

}

else if(value==="⌫"){

deleteLetter();

}

else{

typeLetter(value);

}

};

});

function submitGuess(){

if(currentCol<5){

showMessage("Not enough letters!");

return;

}

const guess=currentGuess();

if(!words.includes(guess)){

showMessage("Not in character list!");

return;

}

let answerLetters=answer.split("");

// First pass (correct letters)
for(let i=0;i<5;i++){

const tile=rows[currentRow].children[i];

tile.classList.add("flip");

if(guess[i]===answer[i]){

tile.classList.add("correct");
answerLetters[i]=null;

}

}

// Second pass (present/absent)
for(let i=0;i<5;i++){

const tile=rows[currentRow].children[i];

if(tile.classList.contains("correct")){

colorKey(guess[i],"correct");
continue;

}

const index=answerLetters.indexOf(guess[i]);

if(index!==-1){

tile.classList.add("present");
answerLetters[index]=null;

colorKey(guess[i],"present");

}else{

tile.classList.add("absent");

colorKey(guess[i],"absent");

}

}

if(guess===answer){

gameOver=true;

showMessage("You Win!");

restart.style.display="block";

return;

}

currentRow++;
currentCol=0;

if(currentRow>=6){

gameOver=true;

showMessage("Answer: "+answer);

restart.style.display="block";

}

}

restart.onclick=()=>{

answer=words[Math.floor(Math.random()*words.length)];

currentRow=0;
currentCol=0;
gameOver=false;

message.textContent="";

rows.forEach(row=>{

row.querySelectorAll(".tile").forEach(tile=>{

tile.textContent="";
tile.className="tile";

});

});

keys.forEach(key=>{

key.className=key.textContent==="ENTER"||key.textContent==="⌫"
? "key big"
: "key";

});

restart.style.display="none";

};

</script>

</body>
</html>
